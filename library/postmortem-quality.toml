description = "Постмортем написан формально: причина не доведена до кода или нет опровергнутых версий"
event    = "Stop"
type     = "judge"
severity = "warn"
message  = "Постмортем неполон — дозаполни, иначе будущий разбор потеряет время на то же самое."

[[match]]
"transcript.tools" = 'Skill\(postmortem\)'

[check]
model   = "haiku"
input   = ["transcript"]
timeout = 45
prompt  = """
Ниже транскрипт сессии, в которой писали разбор инцидента (постмортем).

Проверь ДВА пункта:
1. Причина доведена до конкретной строки кода, SQL-предиката или конфигурации — а не
   остановилась на уровне «сервис вернул ошибку» / «данные не пришли».
2. Зафиксирована хотя бы одна версия, которая рассматривалась и была ОПРОВЕРГНУТА.
   Это не придирка: почти в каждом разборе есть отброшенная гипотеза, и если её не
   записать, следующий разбор потратит на неё время снова.

Если оба пункта выполнены — violated: false.
"""

[escape]
source = "prompt"
marker = "[skip-postmortem]"
