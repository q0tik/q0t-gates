description = "Разбирали инцидент или прод-баг, но разбор нигде не записан"
event    = "Stop"
type     = "script"
severity = "warn"
message  = """Похоже, в сессии разбирали инцидент, а разбор нигде не зафиксирован.
Разбор, оставшийся только в чате, через неделю не существует.

В QB: skill `postmortem` — пишет по схеме в `incidents/`, которую потом читает `incident-recall`.
Вне QB: запиши в vault хотя бы симптом → хронологию → причину до строки кода → как доказано,
и отдельно — какие версии рассматривались и были опровергнуты.

Если инцидент не твой или разбирали для понимания — [skip-postmortem] в сообщении."""

[check]
script = "checks/postmortem_required.py"

[escape]
source = "prompt"
marker = "[skip-postmortem]"
