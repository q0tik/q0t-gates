description = "В staged-изменениях файл, похожий на секреты (.env, приватный ключ, keystore)"
event    = "PreToolUse"
type     = "pattern"
severity    = "warn"
fail_closed = true
message  = """Похоже, в коммит попал файл с секретами. Проверь `git diff --staged --name-only`.
Если это шаблон без значений — обойди маркером [allow-env] в сообщении коммита."""

[[match]]
tool    = "Bash"
command = '^\s*git\s+commit\b'

[[match]]
tool = ["mcp__gitlab-qb__*", "mcp__github__create_or_update_file", "mcp__github__push_files"]

[check]
source  = "staged_diff"
deny_if = '(?m)^\+\+\+ b/.*(?:(?:^|/|\.)env(?:\.|$)|\.pem$|\.p12$|\.keystore$|(?:^|/)id_(?:rsa|ed25519)$|\.key$)'

[escape]
source = "commit_message"
marker = "[allow-env]"
