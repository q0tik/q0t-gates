description = "Прямой вызов mcp__telegram__* из основного контекста вместо субагента telegram-agent"
event    = "PreToolUse"
type     = "pattern"
severity = "warn"
message  = """Telegram — только через субагента telegram-agent (Agent tool, subagent_type: "telegram-agent").
tg_dialogs отдаёт ~2800 токенов за вызов и забивает основной контекст."""

[[match]]
tool = "mcp__telegram__*"

[check]
source  = "in_subagent"
deny_if = '^false$'
