description = "LLM-атрибуция в сообщении коммита — в QB запрещена (rules/python-services.md)"
event    = "PreToolUse"
type     = "pattern"
severity = "warn"
message  = "Убери LLM-атрибуцию из сообщения коммита: Co-Authored-By: Claude / Generated with Claude."

[[match]]
tool    = "Bash"
command = '^\s*git\s+commit\b'

[[match]]
tool = ["mcp__gitlab-qb__*", "mcp__github__create_or_update_file", "mcp__github__push_files"]

[check]
source  = "commit_message"
deny_if = '(?i)Co-Authored-By:\s*Claude|Generated with \[?Claude|🤖\s*Generated'
